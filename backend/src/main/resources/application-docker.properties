spring.application.name=backend

spring.datasource.url=jdbc:postgresql://postgres:5432/GestionReserva
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


server.servlet.context-path=/api/v1


management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always


info.app.name=Coworking Reservation API
info.app.description=Backend reservation management service
info.app.version=1.0.0